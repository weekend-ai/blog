defaultContentLanguage: "en"
languages:
  en:
    languageCode: en-us
    languageName: "English"
    title: "Zinuo"
    contentDir: "content/en"
    weight: 1
    menus:
      main:
        - name: Notes
          url: /posts/
          weight: 10
        - name: Now
          url: /now/
          weight: 20
        - name: Resume
          url: /cv/
          weight: 30
    params:
      description: "Zinuo builds products with AI and shares what he learns along the way."
      profileMode:
        enabled: false
      landing:
        hero:
          name: "Zinuo Li"
          kicker: "Hi, I'm Zinuo."
          headline: "I build products with AI."
          tagline: "I like taking a new AI capability and pushing it until it becomes something people can actually use. This is where I share the experiments, mistakes, and lessons along the way."
          motto: "Curious about what AI makes possible. Serious about product. Happy to share the process."
          cta:
            - name: "See what I'm building"
              url: "#projects"
              primary: true
            - name: "Read my notes"
              url: "/posts/"
            - name: "GitHub"
              url: "https://github.com/weekend-ai"
        passions:
          title: "What I care about"
          description: "AI moves fast. I stay grounded by building real things and paying attention to how people use them."
          items:
            - name: "AI products"
              description: "The interesting part starts after the demo: choosing the right problem, shaping the experience, and earning repeat use."
              details:
                - "Product discovery"
                - "Rapid prototypes"
                - "Feedback loops"
                - "The small details"
            - name: "Agents that do real work"
              description: "I explore agents with tools, memory, and useful boundaries. The goal is less magic and more dependable help."
              details:
                - "Research workflows"
                - "Personal AI"
                - "SRE and debugging"
                - "Human-AI collaboration"
            - name: "Sharing the process"
              description: "Writing forces me to be clear. I share build notes, system-design lessons, and the failures that changed my mind."
              details:
                - "Build notes"
                - "System design"
                - "Open-source experiments"
                - "What failed and why"
        projects:
          title: "What I'm building"
          description: "A few ongoing experiments at the intersection of AI, product, and systems."
          items:
            - name: "Digital Ray"
              description: "A personal thinking companion that connects principles, memory, and everyday decisions."
              tags:
                - "Personal AI"
                - "Memory"
                - "Knowledge"
                - "Product Design"
            - name: "SRE Agent Framework"
              description: "An AI teammate that gathers evidence and helps engineers reason through incidents."
              tags:
                - "Agent Workflow"
                - "Tool Use"
                - "Reliability"
            - name: "Deep Research Agent"
              description: "A research experience that plans the work, checks the evidence, and keeps citations attached."
              tags:
                - "Research"
                - "Verification"
                - "Evidence UX"
        loop:
          title: "The loop I trust"
          description: "Most of my best learning follows the same path."
          items:
            - name: "Explore"
              description: "Follow a question until it becomes concrete enough to test."
            - name: "Build"
              description: "Turn the idea into something I can use, then put it in front of other people."
            - name: "Share"
              description: "Write down the useful parts while they are still fresh."
        writing:
          title: "Notes from the build"
          description: "I write to work out what I think and to leave a useful trail for the next experiment."
          posts:
            - title: "System Design: Deep Research Agent"
              url: "/posts/system-design-deep-research-agent/"
          all_label: "Browse all notes"
          all_url: "/posts/"

  zh:
    languageCode: zh-cn
    languageName: "中文"
    title: "子诺"
    contentDir: "content/zh"
    weight: 2
    menus:
      main:
        - name: 随笔
          url: /posts/
          weight: 10
        - name: 近况
          url: /now/
          weight: 20
        - name: 简历
          url: /cv/
          weight: 30
    params:
      description: "子诺喜欢用 AI 做产品，也愿意分享一路上的实验、踩坑和思考。"
      profileMode:
        enabled: false
      landing:
        hero:
          name: "李子诺"
          kicker: "你好，我是子诺。"
          headline: "我喜欢用 AI 做产品。"
          tagline: "我喜欢把新的 AI 能力一路做成真正有人愿意用的产品。这里记录我的实验、踩坑，以及一路学到的东西。"
          motto: "拥抱 AI，认真做产品，也愿意分享过程。"
          cta:
            - name: "看看我在做什么"
              url: "#projects"
              primary: true
            - name: "读读我的随笔"
              url: "/posts/"
            - name: "GitHub"
              url: "https://github.com/weekend-ai"
        passions:
          title: "我在意的事"
          description: "AI 变化很快。我更愿意通过真正做产品，观察人们怎么用，来理解这些变化。"
          items:
            - name: "AI 产品"
              description: "Demo 之后才是真正有意思的部分：选对问题、打磨体验，让人愿意第二次打开它。"
              details:
                - "产品发现"
                - "快速原型"
                - "用户反馈"
                - "小而重要的细节"
            - name: "真正能做事的 Agent"
              description: "我在探索有工具、有记忆、也有清晰边界的 Agent。比起魔法感，我更在意它能不能稳定帮上忙。"
              details:
                - "研究工作流"
                - "个人 AI"
                - "SRE 与调试"
                - "人与 AI 协作"
            - name: "分享过程"
              description: "写下来会逼我把事情想清楚。我会分享构建笔记、系统设计，以及那些让我改变想法的失败。"
              details:
                - "构建笔记"
                - "系统设计"
                - "开源实验"
                - "失败与复盘"
        projects:
          title: "我正在构建"
          description: "几个长期进行中的实验，围绕 AI、产品和系统展开。"
          items:
            - name: "Digital Ray"
              description: "一个连接原则、记忆和日常决策的个人思考伙伴。"
              tags:
                - "个人 AI"
                - "长期记忆"
                - "知识连接"
                - "产品设计"
            - name: "SRE Agent Framework"
              description: "一个会收集证据、帮助工程师一起推理故障的 AI 队友。"
              tags:
                - "Agent 工作流"
                - "工具调用"
                - "可靠性"
            - name: "Deep Research Agent"
              description: "一个会规划研究、核对证据，并始终保留引用关系的研究产品。"
              tags:
                - "深度研究"
                - "事实核验"
                - "证据链呈现"
        loop:
          title: "我相信的循环"
          description: "我学得最好的时候，通常都在重复同一个过程。"
          items:
            - name: "探索"
              description: "沿着一个问题追下去，直到它具体到可以验证。"
            - name: "构建"
              description: "把想法做成自己能用的东西，再交给真实的人试一试。"
            - name: "分享"
              description: "趁记忆还新鲜，把真正有用的部分写下来。"
        writing:
          title: "构建途中的随笔"
          description: "我用写作理清自己的想法，也给下一次实验留下一条能回看的路。"
          posts:
            - title: "系统设计：Deep Research Agent"
              url: "/posts/system-design-deep-research-agent/"
          all_label: "浏览全部随笔"
          all_url: "/posts/"

